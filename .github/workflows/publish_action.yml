name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Ramon-Balaguer' }}
    env:
      HAS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN != '' }}
    steps:
      - name: Skip (no REGISTRY_ACCESS_TOKEN secret yet)
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add the REGISTRY_ACCESS_TOKEN repository secret to publish to registry.comfy.org"
      - name: Check out code
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - name: Publish Custom Node
        if: env.HAS_TOKEN == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
